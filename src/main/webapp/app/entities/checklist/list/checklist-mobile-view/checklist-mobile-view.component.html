<div class="checklist-mobile-list">
  @for (checklist of checklists(); track checklist.id) {
    <mat-card class="checklist-card" appearance="outlined">
      <div class="checklist-card-header">
        <mat-card-header>
          <mat-card-title>{{ checklist.title }}</mat-card-title>
        </mat-card-header>

        <button
          mat-icon-button
          class="card-menu-btn"
          [matMenuTriggerFor]="cardMenu"
          aria-label="Checklist actions"
          data-cy="entityActionsButton"
        >
          <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #cardMenu="matMenu">
          <a mat-menu-item [routerLink]="['/checklist', checklist.id, 'view']" data-cy="entityDetailsButton">
            <mat-icon class="menu-icon-view">visibility</mat-icon>
            <span>View</span>
          </a>
          <a mat-menu-item [routerLink]="['/checklist', checklist.id, 'edit']" data-cy="entityEditButton">
            <mat-icon class="menu-icon-edit">edit</mat-icon>
            <span>Edit</span>
          </a>
          <button mat-menu-item (click)="delete.emit(checklist)" data-cy="entityDeleteButton">
            <mat-icon class="menu-icon-delete">delete</mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
      </div>

      <mat-card-content>
        <div class="checklist-card-row checklist-meta">
          @if (checklist.task) {
            <a [routerLink]="['/task', checklist.task.id, 'view']" class="meta-link">
              <mat-icon class="meta-icon">assignment</mat-icon>
              <span>{{ checklist.task.title }}</span>
            </a>
          }
          @if (checklist.createdDate) {
            <span class="checklist-created-date">
              <mat-icon class="meta-icon">event</mat-icon>
              {{ checklist.createdDate | formatMediumDatetime }}
            </span>
          }
        </div>
      </mat-card-content>
    </mat-card>
  }
</div>
