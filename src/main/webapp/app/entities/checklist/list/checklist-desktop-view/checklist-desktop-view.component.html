<div class="mat-elevation-z1 checklist-table-container">
  <table
    mat-table
    [dataSource]="checklists()"
    jhiSort
    [(sortState)]="sortStateSignal"
    (sortChange)="sortChange.emit($event)"
    class="checklist-mat-table"
  >
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef jhiSortBy="title">
        <span jhiTranslate="projectManagementApp.checklist.title">Title</span>
        <mat-icon class="sort-icon">unfold_more</mat-icon>
      </th>
      <td mat-cell *matCellDef="let checklist">{{ checklist.title }}</td>
    </ng-container>

    <ng-container matColumnDef="createdDate">
      <th mat-header-cell *matHeaderCellDef jhiSortBy="createdDate">
        <span jhiTranslate="projectManagementApp.checklist.createdDate">Created Date</span>
        <mat-icon class="sort-icon">unfold_more</mat-icon>
      </th>
      <td mat-cell *matCellDef="let checklist">{{ checklist.createdDate | formatMediumDatetime }}</td>
    </ng-container>

    <ng-container matColumnDef="task">
      <th mat-header-cell *matHeaderCellDef jhiSortBy="task.title">
        <span jhiTranslate="projectManagementApp.checklist.task">Task</span>
        <mat-icon class="sort-icon">unfold_more</mat-icon>
      </th>
      <td mat-cell *matCellDef="let checklist">
        @if (checklist.task) {
          <a [routerLink]="['/task', checklist.task.id, 'view']">{{ checklist.task.title }}</a>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      data-cy="entityTable"
      class="checklist-row"
      (contextmenu)="onRowContextMenu($event, row)"
    ></tr>
  </table>
</div>

<!-- Hidden trigger for the right-click context menu - its position is moved to the
     cursor's coordinates in onRowContextMenu() below, then opened programmatically.
     This is the standard Angular Material pattern for a context menu since mat-menu
     itself has no "open at arbitrary x/y" API. -->
<div
  style="visibility: hidden; position: fixed"
  [style.left.px]="contextMenuPosition.x"
  [style.top.px]="contextMenuPosition.y"
  [matMenuTriggerFor]="rowMenu"
></div>

<mat-menu #rowMenu="matMenu">
  <ng-template matMenuContent let-checklist="checklist">
    <a mat-menu-item [routerLink]="['/checklist', checklist.id, 'view']" data-cy="entityDetailsButton">
      <mat-icon class="menu-icon-view">visibility</mat-icon>
      <span>View</span>
    </a>
    <a mat-menu-item [routerLink]="['/checklist', checklist.id, 'edit']" data-cy="entityEditButton">
      <mat-icon class="menu-icon-edit">edit</mat-icon>
      <span>Edit</span>
    </a>
    <button mat-menu-item (click)="delete.emit(checklist)" data-cy="entityDeleteButton">
      <mat-icon class="menu-icon-delete">delete</mat-icon>
      <span>Delete</span>
    </button>
  </ng-template>
</mat-menu>
