<div>
  <h2 id="page-heading" data-cy="DepartmentHeading">
    <span jhiTranslate="projectManagementApp.department.home.title">Departments</span>

    <div class="d-flex justify-content-end">
      <button mat-flat-button color="primary" class="me-2" (click)="load()" [disabled]="isLoading">
        <mat-icon [class.spin]="isLoading">refresh</mat-icon>
        <span jhiTranslate="projectManagementApp.department.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        mat-flat-button
        color="primary"
        class="jh-create-entity create-department"
        [routerLink]="['/department/new']"
      >
        <mat-icon>add</mat-icon>
        <span jhiTranslate="projectManagementApp.department.home.createLabel">Create a new Department</span>
      </button>
    </div>
  </h2>

  <div class="department-filter-container">
    <mat-form-field appearance="outline" class="department-name-field" subscriptSizing="dynamic">
      <mat-label>Filter by name</mat-label>
      <input matInput type="text" [ngModel]="filterName()" (ngModelChange)="onNameInput($event)" />
    </mat-form-field>

    @if (filterName()) {
      <button mat-icon-button aria-label="Clear filters" class="department-filter-clear-btn" (click)="clearSearch()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>

  <jhi-alert-error />

  <jhi-alert />

  @if (departments().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span jhiTranslate="projectManagementApp.department.home.notFound">No Departments found</span>
    </div>
  } @else {
    <div class="mat-elevation-z1 department-table-container">
      <table
        mat-table
        [dataSource]="departments()"
        jhiSort
        [(sortState)]="sortState"
        (sortChange)="navigateToWithComponentValues($event)"
        class="department-mat-table"
      >
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef jhiSortBy="name">
            <span jhiTranslate="projectManagementApp.department.name">Name</span>
            <mat-icon class="sort-icon">unfold_more</mat-icon>
          </th>
          <td mat-cell *matCellDef="let department">{{ department.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef jhiSortBy="description">
            <span jhiTranslate="projectManagementApp.department.description">Description</span>
            <mat-icon class="sort-icon">unfold_more</mat-icon>
          </th>
          <td mat-cell *matCellDef="let department">{{ department.description }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          data-cy="entityTable"
          class="department-row"
          (contextmenu)="onRowContextMenu($event, row)"
        ></tr>
      </table>
    </div>
  }

  @if (departments().length > 0) {
    <mat-paginator
      class="department-paginator"
      [length]="totalItems"
      [pageSize]="itemsPerPage"
      [pageIndex]="page - 1"
      [hidePageSize]="true"
      [showFirstLastButtons]="true"
      (page)="onPageChange($event)"
    ></mat-paginator>
  }
</div>

<!-- Hidden trigger for the right-click context menu - its position is moved to the
     cursor's coordinates in onRowContextMenu() below, then opened programmatically.
     This is the standard Angular Material pattern for a context menu since mat-menu
     itself has no "open at arbitrary x/y" API. -->
<div
  style="visibility: hidden; position: fixed"
  [style.left.px]="contextMenuPosition.x"
  [style.top.px]="contextMenuPosition.y"
  [matMenuTriggerFor]="rowMenu"
></div>

<mat-menu #rowMenu="matMenu">
  <ng-template matMenuContent let-department="department">
    <a mat-menu-item [routerLink]="['/department', department.id, 'view']" data-cy="entityDetailsButton">
      <mat-icon class="menu-icon-view">visibility</mat-icon>
      <span>View</span>
    </a>
    <a mat-menu-item [routerLink]="['/department', department.id, 'edit']" data-cy="entityEditButton">
      <mat-icon class="menu-icon-edit">edit</mat-icon>
      <span>Edit</span>
    </a>
    <button mat-menu-item (click)="delete(department)" data-cy="entityDeleteButton">
      <mat-icon class="menu-icon-delete">delete</mat-icon>
      <span>Delete</span>
    </button>
  </ng-template>
</mat-menu>
