@if (employee) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(employee.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="employeeDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      @if (!checkingReferences && messages.length === 0) {
        <p
          id="jhi-delete-project-heading"
          jhiTranslate="projectManagementApp.project.delete.question"
          [translateValues]="{ id: employee.id }"
        >
          Are you sure you want to delete Employee {{ employee.id }}?
        </p>
      }

      @for (msg of messages; track msg.message) {
        <div class="text-danger">{{ msg.message }}</div>
      }
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
      </button>

      @if (messages.length === 0) {
        <button
          id="jhi-confirm-delete-employee"
          data-cy="entityConfirmDeleteButton"
          type="submit"
          class="btn btn-danger"
          [disabled]="checkingReferences"
        >
          <fa-icon icon="times"></fa-icon>&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
        </button>
      }
    </div>
  </form>
}
