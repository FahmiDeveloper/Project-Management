<div>
  <h2 id="page-heading">
    <span id="user-management-page-heading" data-cy="userManagementPageHeading" jhiTranslate="userManagement.home.title">Users</span>

    <div class="d-flex justify-content-end">
      <button mat-stroked-button color="primary" class="me-2" (click)="loadAll()" [disabled]="isLoading()">
        <mat-icon [class.spin]="isLoading()">refresh</mat-icon>
        <span class="btn-label" jhiTranslate="userManagement.home.refreshListLabel">Refresh list</span>
      </button>
      <button mat-flat-button color="primary" class="jh-create-entity" [routerLink]="['./new']">
        <mat-icon>add</mat-icon>
        <span class="btn-label" jhiTranslate="userManagement.home.createLabel">Create a new user</span>
      </button>
    </div>
  </h2>

  @if (isMobile()) {
    <mat-expansion-panel class="user-filter-panel">
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-icon>filter_list</mat-icon>
          <span class="filter-panel-label">Filters</span>
          @if (activeFilterCount() > 0) {
            <span class="filter-count-badge">{{ activeFilterCount() }}</span>
          }
        </mat-panel-title>
      </mat-expansion-panel-header>

      <div class="user-filter-container user-filter-container-mobile">
        <mat-form-field appearance="outline" class="user-login-field" subscriptSizing="dynamic">
          <mat-label>Login</mat-label>
          <input matInput type="text" [ngModel]="filterLogin()" (ngModelChange)="onLoginInput($event)" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="user-email-field" subscriptSizing="dynamic">
          <mat-label>Email</mat-label>
          <input matInput type="text" [ngModel]="filterEmail()" (ngModelChange)="onEmailInput($event)" />
        </mat-form-field>

        @if (activeFilterCount() > 0) {
          <button mat-stroked-button class="user-filter-clear-btn-mobile" (click)="clearSearch()">
            <mat-icon>close</mat-icon>
            Clear filters
          </button>
        }
      </div>
    </mat-expansion-panel>
  } @else {
    <div class="user-filter-container">
      <mat-form-field appearance="outline" class="user-login-field" subscriptSizing="dynamic">
        <mat-label>Login</mat-label>
        <input matInput type="text" [ngModel]="filterLogin()" (ngModelChange)="onLoginInput($event)" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="user-email-field" subscriptSizing="dynamic">
        <mat-label>Email</mat-label>
        <input matInput type="text" [ngModel]="filterEmail()" (ngModelChange)="onEmailInput($event)" />
      </mat-form-field>

      @if (activeFilterCount() > 0) {
        <button mat-icon-button aria-label="Clear filters" class="user-filter-clear-btn" (click)="clearSearch()">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
  }

  <jhi-alert-error />

  <jhi-alert />

  @if (users()) {
    @if (isMobile()) {
      <jhi-user-management-mobile-view
        [users]="users"
        [currentAccount]="currentAccount"
        (setActive)="onSetActive($event)"
        (delete)="deleteUser($event)"
      />
    } @else {
      <jhi-user-management-desktop-view
        [users]="users"
        [sortStateSignal]="sortState"
        [currentAccount]="currentAccount"
        (sortChange)="transition($event)"
        (setActive)="onSetActive($event)"
        (delete)="deleteUser($event)"
      />
    }

    <mat-paginator
      class="user-paginator"
      [length]="totalItems()"
      [pageSize]="itemsPerPage"
      [pageIndex]="page - 1"
      [hidePageSize]="true"
      [showFirstLastButtons]="true"
      (page)="onPageChange($event)"
    ></mat-paginator>
  }
</div>
